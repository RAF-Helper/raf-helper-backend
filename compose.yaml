services:
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
    environment:
      - node.name=es
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.watermark.low=97%
      - cluster.routing.allocation.disk.watermark.high=98%
      - cluster.routing.allocation.disk.watermark.flood_stage=99%
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    mem_limit: 4096m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgresql:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
        POSTGRES_DB: ${POSTGRES_DATABASE}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        PGDATA: "/var/lib/postgresql/data/pgdata"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m

  backend:
    build:
      context: .
      dockerfile: dockerfile
      network: host
    environment:
        POSTGRES_HOST: "postgresql"
        DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgresql/${POSTGRES_DATABASE}
        ELASTICSEARCH_URL: http://elastic:9200
        STORAGE_PATH: /app/storage
        OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
        TAVILY_API_KEY: ${TAVILY_API_KEY}
        HF_TOKEN: ${HF_TOKEN}
        DEBUG: ${DEBUG}
    depends_on:
      postgresql:
        condition: service_healthy
      elastic:
        condition: service_healthy
    ports:
      - "8000:10000"
    volumes:
      - backend_storage:/app/storage
    env_file:
      - .env
    networks:
      ipv6_special_network:
        ipv6_address: fd00:1234:5678::10
    develop:
      watch:
        - action: rebuild
          path: ./src
          ignore:
            - src/**/__pycache__/

volumes:
  postgres_data:
  elastic_data:
  backend_storage:

# supabase requires ipv6 configuration, so this network is required to run the backend container
networks:
  ipv6_special_network:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1234:5678::/64
