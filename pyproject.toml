[project]
name = "raf-helper-backend"
version = "0.1.0"
description = "Raf Helper Backend - Multiagent RAG system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "elasticsearch>=9.3.0",
    "fastapi>=0.135.1",
    "firebase-admin>=7.3.0",
    "langchain-openrouter>=0.1.0",
    "langgraph>=1.1.3",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "python-docx>=1.1.2",
    "pypdf>=5.1.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
    "httpx>=0.28.1",
    "python-pptx>=1.0.2",
    "psycopg2-binary>=2.9.11",
    "asyncpg>=0.31.0",
]

[tool.uv]
package = true
