[project]
name = "raf-helper-backend"
version = "0.1.0"
description = "Raf Helper Backend - Multiagent RAG system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "aiofiles>=24.1.0",
    "elasticsearch>=9.3.0",
    "fastapi>=0.135.1",
    "firebase-admin>=7.3.0",
    "langchain-openrouter>=0.1.0",
    "langgraph>=1.1.3",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "pypdf>=5.1.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
    "httpx>=0.28.1",
    "python-pptx>=1.0.2",
    "psycopg2-binary>=2.9.11",
    "asyncpg>=0.31.0",
    "aiohttp>=3.13.3",
    "spacy>=3.8.11",
    "ru-core-news-md",
    "sentence-transformers>=3.4.0",
    "chainlit>=2.5.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
]

[tool.uv]
package = true

[tool.uv.sources]
ru-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/ru_core_news_md-3.8.0/ru_core_news_md-3.8.0-py3-none-any.whl" }
