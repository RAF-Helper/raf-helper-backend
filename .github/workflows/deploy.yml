name: Deploy to Server
on:
  push:
    branches: [main]
jobs:
  deploy:

    runs-on: self-hosted

    env:
      PROJECT_DIR: /home/debian/raf-helper-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Create env secrets
        run: |
          echo "PORT=${{ secrets.PORT }}" > .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "ELASTICSEARCH_UPDATE_PASSWORD=${{ secrets.ELASTICSEARCH_UPDATE_PASSWORD }}" >> .env
          echo "FIREBASE_CREDENTIALS_PATH=${{ secrets.FIREBASE_CREDENTIALS_PATH }}" >> .env
          echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
          echo "DEBUG=false" >> .env
          echo "ELASTICSEARCH_URL=${{ secrets.ELASTICSEARCH_URL }}" >> .env
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
          echo "EMBEDDING_PROVIDER=${{ secrets.EMBEDDING_PROVIDER }}" >> .env

          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > firebase-credentials.json

      - name: Copy project to working dir
        run: |
          mkdir -p $PROJECT_DIR
          mkdir -p $PROJECT_DIR/storage
          mkdir -p $PROJECT_DIR/logs
          rsync -av --delete \
            --exclude '.github' \
            --exclude 'storage' \
            --exclude 'logs' \
            . "$PROJECT_DIR"/
      
      - name: Build Docker image
        working-directory: ${{ env.PROJECT_DIR }}
        run: docker build -t raf-helper-backend .

      - name: Stop running containers
        working-directory: ${{ env.PROJECT_DIR }}
        run: docker stop raf-helper-backend || true && docker rm raf-helper-backend || true
      
      - name: Network setup
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker network rm raf-helper-backend-ipv6-special-network || true

          docker network create --ipv6 --subnet fd00:1234:5678::/64 raf-helper-backend-ipv6-special-network
      
      - name: Deploy to server
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker run -d --name raf-helper-backend \
            --cpus="1.0" \
            -p ${{ secrets.PORT }}:${{ secrets.PORT }} \
            --network raf-helper-backend-ipv6-special-network \
            --restart unless-stopped --env-file .env \
            -v ${{ env.PROJECT_DIR }}/firebase-credentials.json:${{ secrets.FIREBASE_CREDENTIALS_PATH }} \
            -v ${{ env.PROJECT_DIR }}/storage:/app/storage \
            -v ${{ env.PROJECT_DIR }}/logs:/app/logs \
            raf-helper-backend
      
      - name: Verify deployment
        run: |
          echo "Waiting for application to start..."
          sleep 10
          docker ps | grep raf-helper-backend || echo "Warning: Container may not be running properly"
